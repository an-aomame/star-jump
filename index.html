<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>星あつめジャンプ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <div class="top-bar" aria-label="ゲーム情報">
        <div>
          <span class="label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div>
          <span class="label">BEST</span>
          <strong id="best">0</strong>
        </div>
      </div>

      <canvas id="game" width="900" height="540" aria-label="星あつめジャンプのゲーム画面"></canvas>

      <div id="overlay" class="overlay">
        <h1>星あつめジャンプ</h1>
        <p>キャラを選んで、星を集めよう。</p>
        <div id="characterSelect" class="character-select" aria-label="キャラクター選択">
          <button class="character-button" type="button" data-character="star">
            <strong>スター</strong>
            <span>標準 / 2回</span>
          </button>
          <button class="character-button" type="button" data-character="sora">
            <strong>ソラ</strong>
            <span>ふわり / 3回</span>
          </button>
          <button class="character-button" type="button" data-character="bolt">
            <strong>ボルト</strong>
            <span>速い / 1回</span>
          </button>
        </div>
        <div class="overlay-actions">
          <button id="startButton" type="button">スタート</button>
          <button id="titleButton" class="secondary-button hidden" type="button">タイトルへ</button>
        </div>
        <span id="version" class="version-label"></span>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
