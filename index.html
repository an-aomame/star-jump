<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>星あつめジャンプ</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <div class="top-bar" aria-label="ゲーム情報">
        <div>
          <span class="label">SCORE</span>
          <strong id="score">0</strong>
        </div>
        <div class="life-panel">
          <span class="label">LIFE</span>
          <div id="lives" class="lives" aria-label="残機 3"></div>
        </div>
        <div>
          <span class="label">BEST</span>
          <strong id="best">0</strong>
        </div>
      </div>

      <canvas id="game" width="900" height="540" aria-label="星あつめジャンプのゲーム画面"></canvas>

      <div id="overlay" class="overlay">
        <h1><ruby>星<rt>ほし</rt></ruby>あつめジャンプ</h1>
        <p>キャラを<ruby>選<rt>えら</rt></ruby>んで、<ruby>星<rt>ほし</rt></ruby>を<ruby>集<rt>あつ</rt></ruby>めよう。</p>
        <div id="characterSelect" class="character-select" aria-label="キャラクター選択">
          <button class="character-button" type="button" data-character="star">
            <strong>スター</strong>
            <span><ruby>標準<rt>ひょうじゅん</rt></ruby> / 2<ruby>回<rt>かい</rt></ruby></span>
          </button>
          <button class="character-button" type="button" data-character="sora">
            <strong>ソラ</strong>
            <span>ふわり / 3<ruby>回<rt>かい</rt></ruby></span>
          </button>
          <button class="character-button" type="button" data-character="bolt">
            <strong>ボルト</strong>
            <span><ruby>速<rt>はや</rt></ruby>い / 1<ruby>回<rt>かい</rt></ruby></span>
          </button>
        </div>
        <div id="professorTip" class="professor-tip" aria-live="polite">
          <div class="professor-face" aria-hidden="true">
            <span></span>
          </div>
          <p id="professorText"></p>
        </div>
        <div id="helpPanel" class="help-panel hidden">
          <div class="professor-tip">
            <div class="professor-face" aria-hidden="true">
              <span></span>
            </div>
            <p>
              <ruby>博士<rt>はかせ</rt></ruby>じゃ。タップかスペースでジャンプして、
              <ruby>雲<rt>くも</rt></ruby>をよけながら<ruby>星<rt>ほし</rt></ruby>を<ruby>集<rt>あつ</rt></ruby>めるんじゃ。
            </p>
          </div>
          <div class="help-rules">
            <div><span class="rule-icon jump-icon"></span><span>タップ / スペース / ↑ でジャンプ</span></div>
            <div><span class="rule-icon cloud-icon"></span><span><ruby>雲<rt>くも</rt></ruby>にあたると<ruby>残機<rt>ざんき</rt></ruby>-1</span></div>
            <div><span class="rule-icon star-icon gold-star"></span><span>きいろの<ruby>星<rt>ほし</rt></ruby>: +1</span></div>
            <div><span class="rule-icon star-icon blue-star"></span><span>あおい<ruby>星<rt>ほし</rt></ruby>: +2</span></div>
            <div><span class="rule-icon star-icon pink-star"></span><span>ピンクの<ruby>星<rt>ほし</rt></ruby>: +5</span></div>
            <div><span class="rule-icon star-icon fever-star"></span><span>でっかい<ruby>星<rt>ほし</rt></ruby>: フィーバー！</span></div>
          </div>
        </div>
        <div class="overlay-actions">
          <button id="startButton" type="button">スタート</button>
          <button id="helpButton" class="secondary-button" type="button">あそびかた</button>
          <button id="helpBackButton" class="secondary-button hidden" type="button">もどる</button>
          <button id="titleButton" class="secondary-button hidden" type="button">タイトルへ</button>
        </div>
        <span id="version" class="version-label"></span>
      </div>
    </main>

    <script src="game.js"></script>
  </body>
</html>
